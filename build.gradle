buildscript {
    repositories {
        mavenCentral()
        maven { url "https://javacard.pro/maven" }
    }
}


plugins {
    id("java")
    id("com.klinec.gradle.javacard") version "1.8.0" apply false
}

apply from: rootProject.file("gradle/jc-home.gradle")

def jcHome = rootProject.ext.resolveJcHome()
def jcHomeSet = jcHome != null
if (!jcHomeSet) {
    project.logger.warn("No JavaCard SDK found - set JC_HOME or initialize the sdks submodule (sdks/jc304_kit)")
}

version = "1.0-SNAPSHOT"

group = "us.q3q"

sourceSets {
    test {
        java {
            srcDir "./applet-stub/src/main/java"
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    if (jcHomeSet) {
        compileOnly project(':applet-stub')
        testImplementation(group: 'com.klinec', name: 'jcardsim', version: '3.0.5.11') {
            // Javacard will be provided by the user at runtime through the JC_HOME env var
            exclude(group: 'oracle.javacard', module: 'api_classic')
        }
    } else {
        // Perform a full-test build, since there's no javacard SDK
        implementation(group: 'com.klinec', name: 'jcardsim', version: '3.0.5.11')
        implementation project(':applet-stub')
    }
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.8.1'

    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.8.1'
}

test {
    useJUnitPlatform()
}

tasks.register('testAll') {
    group = 'verification'
    description = 'Run all JUnit and Python CTAP tests'
    dependsOn 'test', 'testJar'
    doLast {
        exec {
            workingDir layout.projectDirectory.asFile
            commandLine 'bash', layout.projectDirectory.file('scripts/run_python_tests.sh').asFile.absolutePath
        }
    }
}

tasks.register('testJar', Jar) {
    archiveBaseName = project.name + '-tests'
    duplicatesStrategy = 'include'
    from sourceSets.test.output + sourceSets.test.allSource
    from {
        sourceSets.test.runtimeClasspath.filter {
            it.toString().indexOf("jcardsim-") != -1
        }.collect {
            zipTree(it)
        }
    }
}

if (jcHomeSet) {
    apply plugin: "com.klinec.gradle.javacard"
    javacard {
        config {
            jckit jcHome
            cap {
                packageName 'us.q3q.fido2'
                version '0.4'
                aid PackageID
                output 'FIDO2.cap'
                applet {
                    className 'us.q3q.fido2.FIDO2Applet'
                    aid ApplicationID
                }
                dependencies {
                    local {
                        exps project(':applet-stub').layout.buildDirectory.dir('javacard/openjavacard-ndef-stub.exp').get().asFile.absolutePath
                        jar project(':applet-stub').layout.buildDirectory.file('javacard/openjavacard-ndef-stub.exp/stub.jar').get().asFile.absolutePath
                    }
                }
            }
        }
    }

    tasks.named('buildJavaCard') {
        dependsOn(':applet-stub:buildJavaCard')
    }

    tasks.register("buildAllCaps") {
        group = "build"
        description = "Build FIDO2 and NDEF stub CAP files"
        dependsOn("buildJavaCard", ":applet-stub:buildJavaCard")
    }
}
