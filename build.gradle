buildscript {
    repositories {
        mavenCentral()
        maven { url "https://javacard.pro/maven" }
    }
}

apply from: rootProject.file("gradle/jc-home.gradle")

def jcHome = rootProject.ext.resolveJcHome()

tasks.register('testAll') {
    group = 'verification'
    description = 'Run all JUnit and Python CTAP tests'
    dependsOn ':applets:fido2:test', ':applets:fido2:jar', ':applets:fido2:testJar'
    doLast {
        exec {
            workingDir layout.projectDirectory.asFile
            commandLine 'bash', layout.projectDirectory.file('scripts/run_python_tests.sh').asFile.absolutePath
        }
    }
}

if (jcHome != null) {
    tasks.register('buildAllCaps') {
        group = 'build'
        description = 'Build FIDO2 and NDEF stub CAP files'
        dependsOn(':applets:fido2:buildJavaCard', ':applets:ndef:buildJavaCard')
    }
}
